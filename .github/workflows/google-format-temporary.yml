name: Google provider formatting diagnostic
on:
  push:
    branches: [fix/prettier-google-exact-20261123]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compute exact formatting diff
        run: |
          npx prettier --write server/services/google-stock-provider.ts
          git diff -- server/services/google-stock-provider.ts
          npm run format:check
