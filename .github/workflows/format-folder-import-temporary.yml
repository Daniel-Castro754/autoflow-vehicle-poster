name: Temporary folder import formatting preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show Prettier changes to folder importer
        run: |
          npx prettier --write src/Vehicles.tsx src/vehicle-folder-package.ts tests/vehicle-folder-import.mjs docs/FOLDER_STOCK_IMPORT.md README.md
          git diff -- src/Vehicles.tsx src/vehicle-folder-package.ts tests/vehicle-folder-import.mjs docs/FOLDER_STOCK_IMPORT.md README.md
