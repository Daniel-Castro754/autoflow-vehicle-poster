name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Temporary formatted file capture
        run: |
          npx prettier --write extension/background.js extension/content.js extension/popup.js server/routes/auth.ts tests/extension-consumer.mjs tests/extension-session-renewal.mjs >/dev/null
          for file in extension/background.js extension/content.js extension/popup.js server/routes/auth.ts tests/extension-consumer.mjs tests/extension-session-renewal.mjs; do
            echo "AUTO_FORMAT_BEGIN=$file"
            base64 -w0 "$file"
            echo
            echo "AUTO_FORMAT_END=$file"
          done
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:extension
      - run: npm test
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t autoflow:test .
