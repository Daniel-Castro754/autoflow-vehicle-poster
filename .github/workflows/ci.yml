name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:extension
      - run: npm test
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (mirror fallback if Docker Hub rate-limits)
        run: |
          if ! docker build -t autoflow:test .; then
            echo "::warning::Docker Hub unavailable; attempting verified public AWS ECR mirror"
            sed 's|node:24-alpine|public.ecr.aws/docker/library/node:24-alpine|g' Dockerfile > Dockerfile.ci-mirror
            docker build -f Dockerfile.ci-mirror -t autoflow:test .
          fi
