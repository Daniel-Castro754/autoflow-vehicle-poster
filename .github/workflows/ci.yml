name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/routes/vehicles.ts server/services/smart-scheduler.ts src/SchedulingInsights.tsx src/Vehicles.tsx tests/phase-five-intelligence.mjs && git diff -- server/routes/vehicles.ts server/services/smart-scheduler.ts src/SchedulingInsights.tsx src/Vehicles.tsx tests/phase-five-intelligence.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:extension
      - run: npm test
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t autoflow:test .
