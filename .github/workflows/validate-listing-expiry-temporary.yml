name: Temporary listing expiry validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/listing-expiry-supervised-20261123]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preview exact formatting
        run: |
          npx prettier --write server/services/listing-expiry.ts server/routes/listing-expiry.ts server/server.ts server/database/migrations.ts src/ListingExpiryPanel.tsx src/Views.tsx tests/listing-expiry.mjs docs/LISTING_EXPIRY.md package.json
          git diff -- server/services/listing-expiry.ts server/routes/listing-expiry.ts server/server.ts server/database/migrations.ts src/ListingExpiryPanel.tsx src/Views.tsx tests/listing-expiry.mjs docs/LISTING_EXPIRY.md package.json
      - run: npm run typecheck
      - run: npm run test:listing-expiry
      - run: npm run lint
