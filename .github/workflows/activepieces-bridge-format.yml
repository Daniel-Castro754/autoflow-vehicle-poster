name: Temporary bridge formatting
on:
  push:
    branches: [feat/activepieces-local-draft-bridge]
    paths: [.github/workflows/activepieces-bridge-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activepieces-local-draft-bridge
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only the bridge files
        run: npx prettier --write docs/ACTIVEPIECES_BRIDGE.md scripts/activepieces-bridge-lib.mjs scripts/activepieces-bridge.mjs tests/activepieces-bridge.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACTIVEPIECES_BRIDGE.md scripts/activepieces-bridge-lib.mjs scripts/activepieces-bridge.mjs tests/activepieces-bridge.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(bridge): apply Prettier formatting"
            git push origin HEAD:feat/activepieces-local-draft-bridge
          fi
