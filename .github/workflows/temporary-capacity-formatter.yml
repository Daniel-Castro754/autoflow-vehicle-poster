name: Temporary Capacity Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Export Prettier output
        run: |
          npx prettier --write server/routes/organization.ts server/routes/publication-management.ts server/services/ai-agent.ts server/services/profile-capacity.ts src/App.tsx src/ProfileCapacityEditor.tsx tests/profile-capacity.mjs
          node <<'NODE'
          const fs = require('node:fs')
          const paths = ["server/routes/organization.ts","server/routes/publication-management.ts","server/services/ai-agent.ts","server/services/profile-capacity.ts","src/App.tsx","src/ProfileCapacityEditor.tsx","tests/profile-capacity.mjs"]
          for (const path of paths) {
            console.log('<<<PRETTIER_BEGIN:' + path + '>>>')
            const encoded = fs.readFileSync(path).toString('base64')
            for (const chunk of encoded.match(/.{1,120}/g) || []) console.log(chunk)
            console.log('<<<PRETTIER_END:' + path + '>>>')
          }
          NODE
