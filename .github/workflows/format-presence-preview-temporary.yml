name: Temporary presence formatting preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'server/routes/extension.ts'
      - 'server/modules/accounts.ts'
      - 'extension/background.js'
      - 'tests/extension-presence-routing.mjs'
      - 'tests/ai-approval-safety.mjs'
      - '.github/workflows/format-presence-preview-temporary.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/App.tsx server/routes/extension.ts server/modules/accounts.ts extension/background.js tests/extension-presence-routing.mjs tests/ai-approval-safety.mjs
          git diff -- src/App.tsx server/routes/extension.ts server/modules/accounts.ts extension/background.js tests/extension-presence-routing.mjs tests/ai-approval-safety.mjs
