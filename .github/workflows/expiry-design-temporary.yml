name: Temporary expiry UI validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact formatting diff
        run: |
          npx prettier --write src/ListingExpiryPanel.tsx src/listing-expiry.css src/Views.tsx
          git diff -- src/ListingExpiryPanel.tsx src/listing-expiry.css src/Views.tsx
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:listing-expiry
      - run: npm run test:design-final
