name: Temporary AI branch formatting
on:
  push:
    branches: [fix/ai-operation-approval]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/routes/ai.ts server/services/ai-agent.ts server/services/ai-operation-previews.ts src/AiCenterView.tsx tests/ai-approval-safety.mjs
      - run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/ai.ts server/services/ai-agent.ts server/services/ai-operation-previews.ts src/AiCenterView.tsx tests/ai-approval-safety.mjs
          git commit -m "style: format AI safety changes [style-bot]"
          git push origin HEAD:fix/ai-operation-approval
