name: Temporary Brave profile formatting preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'server/routes/organization.ts'
      - 'tests/brave-profile-management.mjs'
      - '.github/workflows/format-brave-preview-temporary.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff (no remote writes)
        run: |
          npx prettier --write compose.yaml README.md server/routes/organization.ts src/App.tsx tests/brave-profile-management.mjs
          git diff -- compose.yaml README.md server/routes/organization.ts src/App.tsx tests/brave-profile-management.mjs
