name: Temporary retirement validation
on:
  push:
    branches: [feat/assisted-listing-retirement-20261124]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact formatting diff
        run: |
          npx prettier --write .
          git diff
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:listing-expiry
      - run: npm run test:extension-manual-launch
      - run: npm run test:autonomous
      - run: npm run test:publication-variant-route
      - run: npm run test:publication-variations
      - run: npm run test:publication-ledger
      - run: npm run test:queue
      - run: npm run test:stock
      - run: npm run test:publish-safety
      - run: npm run build
