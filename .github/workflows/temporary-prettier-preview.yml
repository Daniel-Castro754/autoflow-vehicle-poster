name: Temporary Prettier diff for group toolbar
on:
  push:
    branches:
      - style/marketplace-group-action-buttons
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact formatting differences
        run: |
          npx prettier --write src/Views.tsx src/management-workspaces.css
          git diff -- src/Views.tsx src/management-workspaces.css
