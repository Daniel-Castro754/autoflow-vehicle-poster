name: Temporary Windows-fix formatter
on:
  push:
    branches: [fix/windows-dpapi-startup]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/services/credential-vault.ts tests/windows-vault.mjs
      - name: Commit formatting
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/credential-vault.ts tests/windows-vault.mjs
          git commit -m "style: format Windows DPAPI changes [style-bot]"
          git push origin HEAD:fix/windows-dpapi-startup
