name: Temporary branch formatting
on:
  push:
    branches: [fix/group-curation-integrity]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/Views.tsx tests/autonomous-flow.mjs
      - run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Views.tsx tests/autonomous-flow.mjs
          git commit -m "style: normalize new changes [style-bot]"
          git push origin HEAD:fix/group-curation-integrity
