name: n8n Parallel Pilot Check
on:
  push:
    branches:
      - experiment/n8n-parallel-pilot
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline sample and workflow format checks
        run: node experiments/n8n-piloto/tests/check-workflows.mjs
