name: Temporary Recovery Formatter
on:
  push:
    branches: [feature/portable-vault-recovery]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/vault-recovery.mjs server/services/credential-vault.ts tests/vault-recovery.mjs tests/windows-recovery.mjs
      - run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vault-recovery.mjs server/services/credential-vault.ts tests/vault-recovery.mjs tests/windows-recovery.mjs
          git commit -m "style: format portable recovery [style-bot]"
          git push origin HEAD:feature/portable-vault-recovery
