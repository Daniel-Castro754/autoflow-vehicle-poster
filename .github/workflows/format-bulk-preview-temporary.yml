name: Temporary bulk queue formatting preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Vehicles.tsx'
      - 'src/styles.css'
      - 'src/bulk-publication-queue.ts'
      - 'tests/bulk-publication-queue.mjs'
      - '.github/workflows/format-bulk-preview-temporary.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier --write src/Vehicles.tsx src/styles.css src/bulk-publication-queue.ts tests/bulk-publication-queue.mjs
          git diff -- src/Vehicles.tsx src/styles.css src/bulk-publication-queue.ts tests/bulk-publication-queue.mjs
