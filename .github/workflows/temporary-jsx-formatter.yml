name: Temporary JSX Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show formatting diff
        run: |
          npx prettier --write src/Vehicles.tsx
          git diff -- src/Vehicles.tsx
