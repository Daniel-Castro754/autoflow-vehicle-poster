name: Temporary Vite lockfile refresh
on:
  push:
    branches: [fix/security-vite-8-3-4]
    paths: [.github/workflows/vite-lock-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-vite-8-3-4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate package-lock.json using npm
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@8.3.4 --no-audit --no-fund
      - name: Validate package manifests
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.devDependencies.vite!=='8.3.4'||l.packages[''].devDependencies.vite!=='8.3.4'||l.packages['node_modules/vite'].version!=='8.3.4') process.exit(1)"
      - name: Commit regenerated lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): regenerate Vite 8.3.4 lockfile"
            git push origin HEAD:fix/security-vite-8-3-4
          fi
