name: Temporary Photo Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print formatted file contents for application to PR branch
        run: |
          npx prettier --write server/database/migrations.ts server/routes/photo-curation.ts server/server.ts server/services/photo-curation.ts src/PhotoCurationPanel.tsx tests/photo-curation.mjs
          node <<'NODE'
          const fs = require('node:fs')
          const paths = [
            'server/database/migrations.ts',
            'server/routes/photo-curation.ts',
            'server/server.ts',
            'server/services/photo-curation.ts',
            'src/PhotoCurationPanel.tsx',
            'tests/photo-curation.mjs',
          ]
          for (const path of paths) {
            console.log('<<<PRETTIER_BEGIN:' + path + '>>>')
            const content = fs.readFileSync(path).toString('base64')
            for (const line of content.match(/.{1,120}/g) || []) console.log(line)
            console.log('<<<PRETTIER_END:' + path + '>>>')
          }
          NODE
