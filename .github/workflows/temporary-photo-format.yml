name: Temporary photo selection format preview
on:
  push:
    branches: [fix/automatic-photo-selection-import]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact prettier patch
        run: |
          npx prettier --write tests/photo-curation.mjs
          git diff -- tests/photo-curation.mjs
