name: Temporary vault branch formatting
on:
  push:
    branches: [fix/ai-credential-vault-fallback]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          server/services/credential-vault.ts
          server/services/description-generator.ts
          server/services/ai-agent.ts
          server/services/ai-operation-previews.ts
          server/routes/organization.ts
          server/routes/ai.ts
          server/server.ts
          scripts/backup.mjs
          src/AiCenterView.tsx
          tests/ai-key-persistence.mjs
          tests/backup.mjs
          tests/ai-fallback.mjs
          docs/AI_CREDENTIAL_VAULT.md
      - name: Commit formatting
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/credential-vault.ts server/services/description-generator.ts server/services/ai-agent.ts server/services/ai-operation-previews.ts server/routes/organization.ts server/routes/ai.ts server/server.ts scripts/backup.mjs src/AiCenterView.tsx tests/ai-key-persistence.mjs tests/backup.mjs tests/ai-fallback.mjs docs/AI_CREDENTIAL_VAULT.md
          git commit -m "style: format credential vault [style-bot]"
          git push origin HEAD:fix/ai-credential-vault-fallback
