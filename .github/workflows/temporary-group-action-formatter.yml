name: Temporary group actions formatter
on:
  push:
    branches: [style/marketplace-group-actions]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/Views.tsx src/styles.css tests/group-actions-style.mjs
      - name: Commit formatted files
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Views.tsx src/styles.css tests/group-actions-style.mjs
          git commit -m "style: format marketplace group actions [style-bot]"
          git push origin HEAD:style/marketplace-group-actions
