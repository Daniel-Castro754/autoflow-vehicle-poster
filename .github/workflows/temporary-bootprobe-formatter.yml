name: Temporary boot probe formatter
on:
  push:
    branches: [feature/restored-boot-smoke-test]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/RESTORED_BOOT_SMOKE_TEST.md scripts/restore-drill-worker.mjs server/server.ts src/ReadinessDashboard.tsx
      - name: Commit formatting
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESTORED_BOOT_SMOKE_TEST.md scripts/restore-drill-worker.mjs server/server.ts src/ReadinessDashboard.tsx
          git commit -m "style: format restored boot probe [style-bot]"
          git push origin HEAD:feature/restored-boot-smoke-test
