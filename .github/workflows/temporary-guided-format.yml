name: Temporary guided remediation formatter
on:
  push:
    branches: [feature/guided-remediation]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/services/guided-remediation.ts src/ReadinessDashboard.tsx tests/guided-remediation.mjs tests/system-readiness.mjs
      - name: Commit formatting
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/guided-remediation.ts src/ReadinessDashboard.tsx tests/guided-remediation.mjs tests/system-readiness.mjs
          git commit -m "style: format guided remediation [style-bot]"
          git push origin HEAD:feature/guided-remediation
