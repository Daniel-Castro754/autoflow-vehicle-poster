name: Temporary extension formatting preview
on:
  push:
    branches:
      - fix/extension-fill-handshake-recovery
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show prettier diff
        run: |
          npx prettier --write extension/background.js extension/content.js
          git diff -- extension/background.js extension/content.js
