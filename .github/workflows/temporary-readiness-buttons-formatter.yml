name: Temporary readiness button formatter
on:
  push:
    branches: [style/readiness-buttons-polish]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[style-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ReadinessDashboard.tsx src/styles.css tests/readiness-buttons-design.mjs
      - name: Commit formatting
        run: |
          if test -z "$(git status --porcelain)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReadinessDashboard.tsx src/styles.css tests/readiness-buttons-design.mjs
          git commit -m "style: normalize readiness buttons [style-bot]"
          git push origin HEAD:style/readiness-buttons-polish
